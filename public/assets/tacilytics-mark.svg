<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tacilytics">
  <defs>
    <linearGradient id="t-bg" x1="8" y1="4" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2ee6c5"/><stop offset=".55" stop-color="#14b8a6"/><stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="t-shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#t-bg)"/>
  <rect width="64" height="64" rx="18" fill="url(#t-shine)"/>
  <!-- a quiet "t": the stem is a rising bar chart, the crossbar a closed mouth (tacit). The coral dot is the one thing we let you see: the pattern. -->
  <rect x="14" y="36" width="8" height="14" rx="4" fill="#fff" opacity=".55"/>
  <rect x="28" y="16" width="8" height="34" rx="4" fill="#fff"/>
  <rect x="20" y="25" width="24" height="7" rx="3.5" fill="#fff"/>
  <rect x="42" y="30" width="8" height="20" rx="4" fill="#fff" opacity=".8"/>
  <circle cx="46" cy="16" r="5" fill="#ff7a5c"/>
</svg>
