name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tacilytics version
      placeholder: "2.4.1"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options: [npm / npx, from source, Docker, other]
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Please remove secrets and visitor data before pasting.
      render: shell
