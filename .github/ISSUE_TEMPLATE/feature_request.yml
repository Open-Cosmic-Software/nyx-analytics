name: Feature request
description: Suggest an idea for Tacilytics
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This works without cookies, persistent identifiers or storing IPs.
          required: true
